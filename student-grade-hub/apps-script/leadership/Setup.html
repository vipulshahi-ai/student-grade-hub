<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top"><title>Faculty access settings</title><style>body{font:16px system-ui,sans-serif;background:#f4f6f2;color:#173337;margin:0}.card{max-width:620px;margin:8vh auto;padding:32px;border:1px solid #dce5de;border-radius:16px;background:white}h1{font-size:26px}p{line-height:1.55}label{display:block;font-weight:700;margin:22px 0 8px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bdcfc7;border-radius:8px;font:16px monospace}button{background:#087f75;color:white;border:0;border-radius:8px;padding:12px 15px;font-weight:700;cursor:pointer;margin:12px 8px 0 0}.secondary{background:#edf2ec;color:#173337}#msg{min-height:2em;color:#355f53}@media(max-width:680px){.card{margin:16px;padding:22px}}</style></head><body><main class="card"><h1>Faculty access settings</h1><p>Enter a six-digit code or generate a longer code, then activate it. Share the code privately with authorized viewers. It remains valid until you revoke or replace it.</p><label for="code">Access code</label><input id="code" type="password" autocomplete="new-password" placeholder="Enter six digits or generate a code"><button id="generate" type="button">Generate code</button><button id="activate" type="button" disabled>Activate code</button><button id="revoke" type="button" class="secondary">Revoke access</button><p id="msg" role="status" aria-live="polite"></p><p>Activating a new code or revoking access immediately invalidates existing access-code sessions.</p></main><script>
const code=document.getElementById('code'),message=document.getElementById('msg'),activate=document.getElementById('activate');
code.addEventListener('input',()=>{activate.disabled=!/^(?:[0-9]{6}|[A-Za-z0-9_-]{32})$/.test(code.value);message.textContent='';});
document.getElementById('generate').addEventListener('click',()=>{if(!window.crypto?.getRandomValues){message.textContent='A secure browser is required to generate the code.';return;}const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';code.type='text';code.value=Array.from(bytes,n=>alphabet[n&63]).join('');activate.disabled=false;message.textContent='Copy this code before activating it. It cannot be recovered later.';});
activate.addEventListener('click',()=>{if(!code.value)return;activate.disabled=true;message.textContent='Activating…';google.script.run.withSuccessHandler(()=>{code.value='';code.type='password';message.textContent='Access is active. Keep the code private and share it with authorized viewers.';}).withFailureHandler(e=>{activate.disabled=false;message.textContent=e.message||'Could not activate access.';}).configureLeadershipAccess(code.value);});
document.getElementById('revoke').addEventListener('click',()=>{message.textContent='Revoking…';google.script.run.withSuccessHandler(()=>{code.value='';activate.disabled=true;message.textContent='Faculty Dashboard and existing sessions are revoked.';}).withFailureHandler(e=>{message.textContent=e.message||'Could not revoke access.';}).revokeLeadershipAccess();});
</script></body></html>
